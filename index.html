<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yesman Panadería S.A.S</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .card { background: #111; border: 2px solid #FFD700; border-radius: 20px; padding: 20px; }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; font-family: monospace; color: #fff; }
        .btn { padding: 15px; width: 100%; border-radius: 12px; border: none; font-weight: bold; margin: 10px 0; cursor: pointer; display: block; }
        #conBtn { background: #FFD700; color: #000; font-size: 16px; }
        #depBtn { background: #0088cc; color: #fff; }
        #depBtn:disabled { background: #333; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#FFD700; margin:0;">YESMAN PANADERÍA S.A.S</h2>
        <p style="font-size:10px; color:#888;">INVERSIÓN DIGITAL $PAN</p>
        
        <button class="btn" id="conBtn">CONECTAR MI BILLETERA</button>

        <div class="balance" id="bDisp">0.000002015</div>
        
        <p id="stTxt" style="font-size:12px; color:#888;">🔴 Desconectado</p>

        <button class="btn" id="depBtn" disabled>EFECTUAR DEPÓSITO (1 TON)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let bal = 0.000002015;
        setInterval(() => { bal += 0.000000001; document.getElementById('bDisp').innerText = bal.toFixed(9); }, 1000);

        // Conector simplificado al máximo
        const tonUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json'
        });

        document.getElementById('conBtn').onclick = () => {
            tonUI.openModal().catch(() => alert("Usa Tonkeeper o Wallet de Telegram"));
        };

        tonUI.onStatusChange(w => {
            const d = document.getElementById('depBtn');
            const c = document.getElementById('conBtn');
            const s = document.getElementById('stTxt');
            if (w) {
                d.disabled = false;
                c.innerText = "BILLETERA LISTA ✅";
                c.style.background = "#28a745";
                s.innerText = "🟢 Conectado";
            }
        });

        document.getElementById('depBtn').onclick = async () => {
            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: "UQDl39VhMg-Hwa898TA-WHOBgGkGQFvBMftpuDm4yyTCdfZ2", amount: "1000000000" }]
            };
            await tonUI.sendTransaction(tx).catch(e => alert("Error: " + e.message));
        };
    </script>
</body>
</html>
