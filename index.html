<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yesman Panadería S.A.S</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #111; border: 2px solid #FFD700; border-radius: 20px; padding: 25px; margin-top: 20px; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; color: #FFD700; font-family: monospace; }
        .btn { padding: 18px; width: 100%; border-radius: 15px; border: none; font-weight: bold; margin: 10px 0; font-size: 16px; cursor: pointer; }
        #conBtn { background: #FFD700; color: #000; }
        #depBtn { background: #0088cc; color: #fff; }
        #depBtn:disabled { background: #222; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin:0;">YESMAN PANADERÍA S.A.S</h2>
        <p style="font-size:10px; color:#888;">INVERSIÓN DIGITAL $PAN</p>
        
        <button class="btn" id="conBtn">CONECTAR BILLETERA</button>

        <div class="balance" id="bDisp">0.000002015</div>
        <p style="font-size:11px; color:#FFD700;">BALANCE $PAN EN TIEMPO REAL</p>
        
        <p id="stTxt" style="font-size:12px; color:#888;">🔴 Esperando conexión...</p>

        <button class="btn" id="depBtn" disabled>EFECTUAR DEPÓSITO (1 TON)</button>
    </div>

    <script>
        // Crecimiento del balance
        let bal = 0.000002015;
        setInterval(() => { bal += 0.000000001; document.getElementById('bDisp').innerText = bal.toFixed(9); }, 1000);

        // Inicializar la interfaz de TON
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json'
        });

        // Al presionar el botón de conectar
        document.getElementById('conBtn').onclick = async () => {
            try {
                // Forzamos la apertura del selector de billetera
                await tonConnectUI.openModal();
            } catch (e) {
                alert("Error al abrir billetera. Verifica que Tonkeeper esté instalada.");
            }
        };

        // Detectar cambio de estado (Conexión exitosa)
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('depBtn').disabled = false;
                document.getElementById('stTxt').innerText = "🟢 Billetera Conectada";
                document.getElementById('stTxt').style.color = "#28a745";
                document.getElementById('conBtn').innerText = "VINCULADO";
                document.getElementById('conBtn').style.background = "#28a745";
                document.getElementById('conBtn').style.color = "#fff";
            }
        });

        // Función de depósito
        document.getElementById('depBtn').onclick = async () => {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{
                    address: "UQDl39VhMg-Hwa898TA-WHOBgGkGQFvBMftpuDm4yyTCdfZ2",
                    amount: "1000000000" // 1 TON en nanotons
                }]
            };
            try {
                await tonConnectUI.sendTransaction(transaction);
            } catch (e) {
                alert("Transacción cancelada.");
            }
        };
    </script>
</body>
</html>
