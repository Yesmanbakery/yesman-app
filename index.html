<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yesman Panadería S.A.S</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --gold: #FFD700; --blue: #0088cc; --dark: #111; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card { background: var(--dark); border: 2px solid var(--gold); border-radius: 24px; padding: 25px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1); }
        
        .header-title { font-size: 14px; color: var(--gold); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
        .token-name { font-size: 10px; color: #888; margin-bottom: 15px; }
        
        .balance-container { background: #1a1a1a; padding: 20px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #333; }
        .balance { font-size: 34px; font-weight: 900; font-family: 'Courier New', monospace; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .balance-label { font-size: 11px; color: var(--gold); margin-top: 5px; font-weight: bold; }

        #ton-connect-btn { display: flex; justify-content: center; margin: 20px 0; min-height: 44px; width: 100%; }
        
        .btn { padding: 18px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; width: 100%; margin: 8px 0; font-size: 14px; transition: 0.3s; }
        .btn-dep { background: var(--blue); color: white; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); }
        .btn-dep:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
        .btn-sell { background: #fff; color: #000; }
        
        .status-dot { height: 8px; width: 8px; background-color: #ff4444; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-text { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">Yesman Panadería S.A.S</div>
        <div class="token-name">INVERSIÓN DIGITAL $PAN</div>

        <div class="balance-container">
            <div class="balance" id="balanceDisplay">0.000002015</div>
            <div class="balance-label">BALANCE ACUMULADO</div>
        </div>
        
        <div id="ton-connect-btn"></div>
        
        <div class="status-text" id="walletStatus">
            <span class="status-dot" id="dot"></span> 
            <span id="statusTxt">Desconectado</span>
        </div>

        <button class="btn btn-dep" id="btnDeposito" disabled>DEPÓSITO (1 TON)</button>
        <button class="btn btn-sell" onclick="alert('Venta de producción exitosa')">VENDER PRODUCCIÓN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- MOTOR DE LA PANADERÍA (MINERÍA SIMULADA) ---
        let balance = 0.000002015;
        const balanceElement = document.getElementById('balanceDisplay');
        
        setInterval(() => {
            balance += 0.000000001; // Sube 1 unidad del 9no decimal cada segundo
            balanceElement.innerText = balance.toFixed(9);
        }, 1000);

        // --- CONEXIÓN TON CONNECT ---
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        // Controlar estado de la billetera
        tonConnectUI.onStatusChange(wallet => {
            const btn = document.getElementById('btnDeposito');
            const dot = document.getElementById('dot');
            const txt = document.getElementById('statusTxt');

            if (wallet) {
                btn.disabled = false;
                dot.style.backgroundColor = "#28a745";
                txt.innerText = "Conectado: " + wallet.account.address.substring(0, 4) + "..." + wallet.account.address.slice(-4);
                txt.style.color = "#28a745";
            } else {
                btn.disabled = true;
                dot.style.backgroundColor = "#ff4444";
                txt.innerText = "Desconectado";
                txt.style.color = "#888";
            }
        });

        // Acción de Depósito
        document.getElementById('btnDeposito').onclick = async () => {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{
                    address: "UQDl39VhMg-Hwa898TA-WHOBgGkGQFvBMftpuDm4yyTCdfZ2", // Tu billetera
                    amount: "1000000000" // 1 TON (en nanoton)
                }]
            };
            try {
                await tonConnectUI.sendTransaction(transaction);
                alert("Transacción enviada correctamente");
            } catch (e) {
                console.error("Error:", e);
                alert("Transacción cancelada o fallida");
            }
        };
    </script>
</body>
</html>
