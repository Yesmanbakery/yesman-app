<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yesman Panadería S.A.S</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js" onerror="alert('Error cargando librería TON')"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .card { background: #111; border: 2px solid #FFD700; border-radius: 20px; padding: 25px; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; font-family: 'Courier New', monospace; color: #FFD700; }
        .btn { padding: 18px; width: 100%; border-radius: 15px; border: none; font-weight: bold; margin: 10px 0; cursor: pointer; font-size: 16px; }
        #conBtn { background: #FFD700; color: #000; transition: 0.3s; }
        #depBtn { background: #0088cc; color: #fff; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        #depBtn:disabled { background: #222; color: #555; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin:0;">YESMAN PANADERÍA S.A.S</h2>
        <p style="font-size:11px; color:#888; letter-spacing: 2px;">$PAN DIGITAL INVESTMENT</p>
        
        <button class="btn" id="conBtn">CONECTAR BILLETERA</button>

        <div class="balance" id="bDisp">0.000000000</div>
        <p style="font-size:10px; color:#FFD700;">BALANCE 9 DECIMALES</p>
        
        <p id="stTxt">🔴 Desconectado</p>

        <button class="btn" id="depBtn" disabled>DEPÓSITO (1 TON)</button>
    </div>

    <script>
        // Minería de $PAN - 9 decimales exactos
        let bal = 0.000002015;
        setInterval(() => { 
            bal += 0.000000001; 
            document.getElementById('bDisp').innerText = bal.toFixed(9); 
        }, 1000);

        // Intentar inicializar la UI
        let tonUI;
        try {
            tonUI = new TONConnectUI.TonConnectUI({
                manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json'
            });
        } catch (e) {
            alert("Error al iniciar TON Connect");
        }

        // Función del botón con respuesta visual
        document.getElementById('conBtn').onclick = async () => {
            const btn = document.getElementById('conBtn');
            btn.innerText = "CARGANDO...";
            
            try {
                await tonUI.openModal();
                btn.innerText = "CONECTAR BILLETERA";
            } catch (err) {
                alert("Por favor, asegúrate de tener Tonkeeper instalado.");
                btn.innerText = "REINTENTAR CONEXIÓN";
            }
        };

        tonUI.onStatusChange(w => {
            const d = document.getElementById('depBtn');
            const c = document.getElementById('conBtn');
            const s = document.getElementById('stTxt');
            if (w) {
                d.disabled = false;
                c.innerText = "BILLETERA CONECTADA";
                c.style.background = "#28a745";
                c.style.color = "#fff";
                s.innerHTML = "🟢 Conectado exitosamente";
                s.style.color = "#28a745";
            }
        });

        document.getElementById('depBtn').onclick = async () => {
            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{ address: "UQDl39VhMg-Hwa898TA-WHOBgGkGQFvBMftpuDm4yyTCdfZ2", amount: "1000000000" }]
            };
            try {
                await tonUI.sendTransaction(tx);
            } catch (e) {
                alert("Transacción cancelada");
            }
        };
    </script>
</body>
</html>
