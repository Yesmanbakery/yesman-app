<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yesman Panadería S.A.S</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; font-family:sans-serif; padding:20px;">
    
    <h2 style="color:#FFD700;">YESMAN PANADERÍA S.A.S</h2>
    <p id="status">Cargando conexión segura...</p>

    <div id="ton-connect-btn" style="display:flex; justify-content:center; margin:30px 0; min-height:44px;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Inicializamos la Wallet
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        // Verificamos si carga
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('status').innerText = "¡Billetera Conectada!";
                document.getElementById('status').style.color = "#28a745";
            } else {
                document.getElementById('status').innerText = "Conecta tu wallet para jugar";
            }
        });
    </script>
</body>
</html>
