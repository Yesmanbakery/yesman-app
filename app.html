<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YESMAN PANADERÍA S.A.S</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .card { background: #111; border: 2px solid #FFD700; border-radius: 25px; padding: 25px; }
        .balance { font-size: 30px; font-weight: bold; margin: 20px 0; color: #FFD700; font-family: monospace; }
        .btn { padding: 20px; width: 100%; border-radius: 15px; border: none; font-weight: bold; margin: 10px 0; font-size: 16px; cursor: pointer; }
        #conBtn { background: #FFD700; color: #000; }
        #manualBtn { background: #0088cc; color: #fff; display: block; text-decoration: none; line-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YESMAN PANADERÍA S.A.S</h2>
        <div class="balance" id="bLive">0.000002015</div>
        
        <button class="btn" id="conBtn">1. CONECTAR (AUTO)</button>

        <p style="font-size:12px; color:#888;">Si el de arriba no abre, usa este:</p>

        <a href="https://tonkeeper.com/direct-connect?endpoint=https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json" class="btn" id="manualBtn">2. ABRIR EN TONKEEPER</a>
    </div>

    <script>
        let b = 0.000002015;
        setInterval(() => { b += 0.000000001; document.getElementById('bLive').innerText = b.toFixed(9); }, 1000);

        const tonUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json'
        });

        document.getElementById('conBtn').onclick = () => {
            tonUI.openModal().catch(() => alert("Usa el botón azul de abajo"));
        };
    </script>
</body>
</html>
