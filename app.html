<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST YESMAN</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; padding: 50px; font-family: sans-serif; }
        .btn { padding: 20px; width: 100%; background: #FFD700; color: #000; border: none; border-radius: 15px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .box { border: 1px solid #333; padding: 20px; margin-top: 20px; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>PASO 1: PRUEBA DE BOTÓN</h2>
        <button class="btn" id="testBtn">VINCULAR BILLETERA</button>
        <p id="msg" style="color: #888; margin-top: 10px;">Esperando clic...</p>
    </div>

    <script>
        // Verificamos si la librería cargó
        window.onload = function() {
            if (typeof TONConnectUI !== 'undefined') {
                document.getElementById('msg').innerText = "✅ Librería cargada correctamente";
            } else {
                document.getElementById('msg').innerText = "❌ ERROR: La librería no cargó";
            }
        };

        // Inicializamos
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://yesmanbakery.github.io/yesman-app/tonconnect-manifest.json'
        });

        document.getElementById('testBtn').onclick = async function() {
            // Esta alerta nos dirá si el botón funciona
            alert("Intentando conectar con Web3..."); 
            try {
                await tonConnectUI.openModal();
            } catch (e) {
                alert("Error al abrir: " + e);
            }
        };
    </script>
</body>
</html>
